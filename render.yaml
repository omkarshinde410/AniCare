services:
  - type: web
    name: anicare
    env: node
    plan: free
    region: oregon
    buildCommand: |
      npm install
      npx prisma generate
      npm run build
    startCommand: |
      NODE_ENV=production npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APPOINTMENT_UTC_OFFSET
        value: "+05:30"
      - key: CLIENT_URL
        value: https://anicare-6hp2.onrender.com
      - key: VITE_API_URL
        value: https://anicare-6hp2.onrender.com/api
      # Set VITE_TURN_URL, VITE_TURN_USERNAME, and VITE_TURN_CREDENTIAL in Render
      # when a self-hosted Coturn server is available.
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anicare-db
          property: connectionString

databases:
  - name: anicare-db
    databaseName: anicare
    user: anicare
    plan: free
